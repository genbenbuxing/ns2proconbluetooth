[package]
name = "ns2pro-gui"
description = "Windows desktop app for ns2pro-bridge: connect, disconnect and forget a Switch 2 Pro Controller"
version.workspace = true
edition.workspace = true
# eframe 0.37 needs a newer compiler than the bridge library's MSRV.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ns2pro-bridge-gui"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
ns2pro-bridge = { path = "../ns2pro-bridge" }
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
tray-icon = "0.26"
raw-window-handle = "0.6"
windows = { workspace = true, features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_Input",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
